<!DOCTYPE html>
<html>
<head>
  <title>Create Caregiver Account</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    .container {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
  padding: 20px;
}

.login-card {
  background: #FFFFFF;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #5F8F94;
  margin-bottom: 20px;
}

.login-btn {
  width: 100%;
  background: #6FCF97;
  color: #FFFFFF;
  padding: 12px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  margin-top: 18px;
  cursor: pointer;
}

.error-msg {
  color: red;
  font-size: 14px;
  margin-top: 10px;
  text-align: center;
}

  </style>
</head>
<body>

<div class="container">
  <div class="login-card">

    <h1>Create Account</h1>
    <p class="subtitle">Register as Caregiver</p>

    <form id="registerForm">

      <label>Username</label>
      <input type="text" id="newUser" placeholder="Enter username" required>

      <label>Password</label>
      <input type="password" id="newPass" placeholder="Enter password" required>

      <label>Confirm Password</label>
      <input type="password" id="confirmPass" placeholder="Confirm password" required>

      <button type="submit" class="login-btn">Register</button>

      <p id="regMessage" class="error-msg"></p>

    </form>

  </div>
</div>

<script src="register.js"></script>


</body>

</html>
